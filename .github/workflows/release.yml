name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_TEST_IMAGE: "quay.io/ferricstore/ferricstore:0.11.14@sha256:f7d29befefa15bce4b3755bf786cf7620c814f13bbd336c0d9955581b323b60e"
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - run: scripts/verify-release-tag.sh
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test --cover --exclude integration
      - name: Offline hot-path benchmark smoke test
        run: >-
          mix run bench/sdk_hot_path_benchmark.exs
          --iterations 1 --frames 1000 --body-bytes 32
          --packet-bytes 17 --keys 1000
          --max-append-ms 10.0 --max-append-reductions 50000
          --max-decode-ms 10.0 --max-decode-reductions 100000
          --max-encode-ms 10.0 --max-encode-reductions 100000
          --max-mget-ms 20.0 --max-mget-reductions 70000
          --max-mset-ms 20.0 --max-mset-reductions 250000
      - name: Offline Flow query allocation gate
        run: >-
          mix run bench/flow_query_client_benchmark.exs
          --iterations 500 --records 100 --heap-samples 0
          --max-full-decode-reductions 24000
          --max-projected-decode-reductions 10000
          --max-count-decode-reductions 1000
          --max-raw-validation-reductions 300
      - run: mix hex.build
      - name: Start FerricStore
        run: >-
          docker run --detach --rm --name ferricstore-sdk-contract
          --env FERRICSTORE_PROTECTED_MODE=false
          --env FERRICSTORE_FLOW_SCHEDULER_ENABLED=false
          --env FERRICSTORE_NATIVE_ENABLED=true
          --env FERRICSTORE_NATIVE_BIND=0.0.0.0
          --env FERRICSTORE_NATIVE_PORT=6388
          --env FERRICSTORE_NATIVE_ADVERTISE_HOST=127.0.0.1
          --env FERRICSTORE_NATIVE_ADVERTISE_PORT=6388
          --publish 6388:6388 "$FERRICSTORE_TEST_IMAGE"
      - run: |
          for i in {1..60}; do
            mix run -e 'client = FerricStore.connect!(url: "ferric://127.0.0.1:6388"); FerricStore.ping(client); FerricStore.close(client)' && exit 0
            sleep 1
          done
          exit 1
      - run: mix test --only integration
      - name: End-to-end acknowledged response benchmark
        run: >-
          mix run bench/kv_benchmark.exs
          --url ferric://127.0.0.1:6388 --command set
          --requests 1000 --batch 1 --clients 4
          --value-bytes 32 --min-throughput 100.0
      - name: Stop FerricStore
        if: always()
        run: docker stop ferricstore-sdk-contract || true
      - name: Run authenticated TLS HTTP integration
        env:
          FERRICSTORE_TEST_IMAGE: "quay.io/ferricstore/ferricstore:0.11.14@sha256:f7d29befefa15bce4b3755bf786cf7620c814f13bbd336c0d9955581b323b60e"
        run: scripts/test_http_integration.sh

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - run: mix deps.get
      - name: Verify tag and immutable Hex version
        id: release_guard
        env:
          CHECK_HEX: "true"
        run: scripts/verify-release-tag.sh >> "$GITHUB_OUTPUT"
      - name: Check Hex credentials
        id: hex_creds
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -n "$HEX_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HEX_API_KEY is not configured; skipping Hex publish."
          fi
      - run: mix hex.publish --yes
        if: steps.hex_creds.outputs.available == 'true' && steps.release_guard.outputs.already_published != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
